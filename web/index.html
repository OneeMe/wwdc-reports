<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WWDC Quick Look · Landing Page</title>
    <meta
      name="description"
      content="WWDC Quick Look 是一款 skills.sh 的 skill，安装后在提示词里即可查询 WWDC Session 与资源。"
    />
    <style>
      :root {
        --bg: #060b14;
        --ink: #eef4ff;
        --muted: #9aa6bc;
        --line: rgba(160, 184, 255, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(1000px 360px at 20% -10%, rgba(97, 197, 255, 0.24), transparent),
          radial-gradient(760px 300px at 85% 20%, rgba(166, 104, 255, 0.18), transparent),
          linear-gradient(130deg, #050813 0%, #070f1e 48%, #031021 100%);
      }

      body::after {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0.2;
      }

      .page {
        width: min(920px, calc(100% - 34px));
        margin: 0 auto;
        padding: 34px 0 72px;
      }

      .top-bar {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .lang-btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 12px;
        color: #d4e2ff;
        background: rgba(7, 16, 34, 0.75);
        cursor: pointer;
      }

      .lang-btn.active {
        border-color: rgba(152, 215, 255, 0.72);
        background: rgba(122, 200, 255, 0.22);
        color: #031021;
        font-weight: 700;
      }

      .title {
        margin: 18px 0 0;
        font-size: 2.1rem;
        line-height: 1.2;
        letter-spacing: 0.01em;
      }

      .subtitle {
        margin: 14px 0 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .hero-card,
      .panel {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(9, 18, 35, 0.9), rgba(8, 14, 28, 0.88));
        border-radius: 10px;
        padding: 24px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      }

      .hero-card {
        margin-top: 30px;
      }

      .banner {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .banner img {
        display: block;
        width: 100%;
        height: auto;
      }

      .section {
        margin-top: 20px;
      }

      .section-title {
        margin: 0 0 12px;
        font-size: 1.3rem;
      }

      .card-title {
        margin: 0 0 8px;
        font-size: 1rem;
        color: #8fe4ff;
        font-weight: 700;
      }

      .code {
        display: block;
        margin: 12px 0 0;
        padding: 14px 16px;
        border-radius: 8px;
        background: #050c1a;
        border: 1px solid rgba(152, 180, 255, 0.2);
        color: #d7e7ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.55;
      }

      .cta {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 14px;
        border: 1px solid rgba(154, 199, 255, 0.35);
        border-radius: 8px;
        color: #0a1626;
        text-decoration: none;
        background: linear-gradient(90deg, #6ff0c8, #78c3ff);
        font-weight: 700;
      }

      .prompt-list {
        margin: 0;
        padding-left: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }

      .prompt-label {
        margin: 0 0 8px;
        color: #afd8ff;
        font-weight: 600;
      }

      .muted {
        color: var(--muted);
      }

      .foot {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.93rem;
      }

      @media (max-width: 700px) {
        .page {
          width: calc(100% - 20px);
          padding-top: 24px;
        }

        .top-bar {
          justify-content: center;
          flex-wrap: wrap;
        }

        .title {
          font-size: 1.64rem;
        }

        .hero-card,
        .panel {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
      <main class="page">
      <div class="top-bar">
        <button class="lang-btn" data-lang-target="zh" type="button">中文</button>
        <button class="lang-btn" data-lang-target="en" type="button">EN</button>
        <button class="lang-btn" data-lang-target="ja" type="button">日本語</button>
      </div>

      <h1 class="title" data-i18n="title">WWDC Quick Look · Landing Page</h1>
      <p class="subtitle" data-i18n="subtitle">
        用一句命令安装，在提示词里即可查询 WWDC Session 与资源。
      </p>

      <section class="hero-card">
        <h2 class="section-title" data-i18n="installTitle">安装方式（skills.sh）</h2>
        <div class="card-title" data-i18n="installStep">一键安装</div>
        <code class="code" id="installCommand"></code>
        <a class="cta" href="https://www.skills.sh/swiftggteam/wwdc-quick-look" target="_blank" rel="noreferrer" data-i18n="installLink">去 skills.sh 查看</a>

        <figure class="banner" style="margin: 18px 0 0;">
          <img src="assets/wwdc-quick-look-banner.png" alt="WWDC Quick Look banner" />
        </figure>
      </section>

      <section class="panel section">
        <h2 class="section-title" data-i18n="promptTitle">提示词调用示例</h2>
        <p class="muted" data-i18n="promptIntro">安装完成后，在支持 skills 的聊天环境里直接发提示词：</p>
        <ol class="prompt-list" id="promptExamples"></ol>
      </section>

      <p class="foot" data-i18n="footText">页面聚焦：安装方式 + 提示词调用方式。</p>
    </main>

    <script>
      const localeData = {
        zh: {
          title: "WWDC Quick Look · Landing Page",
          subtitle: "用一句命令安装，在提示词里即可查询 WWDC Session 与资源。",
          installTitle: "安装方式（skills.sh）",
          installStep: "一键安装",
          installLink: "去 skills.sh 查看",
          installCmd: "npx skills add SwiftGGTeam/wwdc-quick-look",
          promptTitle: "提示词调用示例",
          promptIntro: "安装完成后，在支持 skills 的聊天环境里直接发提示词：",
          prompts: [
            "请你用 WWDC Quick Look：列出 2025 年包含“visionOS”和“SwiftUI”关键词的 Session，给我标题和时间点。",
            "请用 WWDC Quick Look 查询 WWDC25 中 code=290 的 Session 详情，并返回 Apple 官方资源链接、相关文档和 Demo 地址。",
            "用 WWDC Quick Look：找 WWDC24 第 150 号 Session 的 transcript，并只截取包含“privacy”相关的前 20 行。"
          ],
          footText: "页面聚焦：安装方式 + 提示词调用方式。"
        },
        en: {
          title: "WWDC Quick Look · Landing Page",
          subtitle: "Install in one command, then query WWDC sessions and resources directly in your prompts.",
          installTitle: "Installation (skills.sh)",
          installStep: "One-command install",
          installLink: "Open on skills.sh",
          installCmd: "npx skills add SwiftGGTeam/wwdc-quick-look",
          promptTitle: "Prompt examples",
          promptIntro: "After installation, call it directly in a supported chat with prompts like:",
          prompts: [
            "Using WWDC Quick Look, list WWDC sessions in 2025 containing the keywords visionOS and SwiftUI, and return titles and timeline hints.",
            "With WWDC Quick Look, show details for WWDC25 session code=290, including Apple resource links, documentation and demo repository URLs.",
            "Use WWDC Quick Look to fetch WWDC24 session code=150 transcript and return only the first 20 lines around the keyword privacy."
          ],
          footText: "This page only covers installation and prompt usage examples."
        },
        ja: {
          title: "WWDC Quick Look · ランディングページ",
          subtitle: "1コマンドでインストールし、プロンプトからWWDCセッションとリソースをそのまま検索できます。",
          installTitle: "導入方法（skills.sh）",
          installStep: "1コマンド導入",
          installLink: "skills.sh を開く",
          installCmd: "npx skills add SwiftGGTeam/wwdc-quick-look",
          promptTitle: "プロンプト呼び出し例",
          promptIntro: "導入後、skills対応のチャットで直接以下のように入力してください：",
          prompts: [
            "WWDC Quick Lookを使って、2025年で「visionOS」「SwiftUI」を含むセッションを一覧化し、タイトルと開始情報を返してください。",
            "WWDC25のセッションコード290の詳細をWWDC Quick Lookで表示し、Apple公式リソース・ドキュメント・デモURLを返してください。",
            "WWDC24のセッションコード150のtranscriptをWWDC Quick Lookで取得し、「privacy」を含む行を先頭から20行だけ返してください。"
          ],
          footText: "このページはインストール方法とプロンプト呼び出し例のみに絞っています。"
        }
      };

      const titleEl = document.querySelector('[data-i18n="title"]');
      const subtitleEl = document.querySelector('[data-i18n="subtitle"]');
      const installTitleEl = document.querySelector('[data-i18n="installTitle"]');
      const installStepEl = document.querySelector('[data-i18n="installStep"]');
      const installLinkEl = document.querySelector('[data-i18n="installLink"]');
      const installCommandEl = document.getElementById('installCommand');
      const promptTitleEl = document.querySelector('[data-i18n="promptTitle"]');
      const promptIntroEl = document.querySelector('[data-i18n="promptIntro"]');
      const promptExamplesEl = document.getElementById('promptExamples');
      const footTextEl = document.querySelector('[data-i18n="footText"]');
      const langButtons = Array.from(document.querySelectorAll('[data-lang-target]'));
      const htmlEl = document.documentElement;

      function setLang(lang) {
        const finalLang = localeData[lang] ? lang : 'zh';
        const data = localeData[finalLang];

        document.title = data.title;
        titleEl.textContent = data.title;
        subtitleEl.textContent = data.subtitle;
        installTitleEl.textContent = data.installTitle;
        installStepEl.textContent = data.installStep;
        installLinkEl.textContent = data.installLink;
        installCommandEl.textContent = data.installCmd;
        promptTitleEl.textContent = data.promptTitle;
        promptIntroEl.textContent = data.promptIntro;
        promptExamplesEl.innerHTML = data.prompts
          .map((text, index) => {
            return `<li><p class="prompt-label">${index + 1}</p><code class="code">${escapeHtml(text)}</code></li>`;
          })
          .join('');
        footTextEl.textContent = data.footText;
        htmlEl.lang = finalLang === 'zh' ? 'zh-CN' : finalLang;

        langButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.langTarget === finalLang);
        });
      }

      function escapeHtml(value) {
        return value
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      langButtons.forEach((button) => {
        button.addEventListener('click', () => {
          setLang(button.dataset.langTarget);
        });
      });

      setLang('zh');
    </script>
  </body>
</html>
